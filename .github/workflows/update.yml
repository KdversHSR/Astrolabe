name: Mise à jour hebdomadaire

on:
  schedule:
    - cron: "0 5 * * 1"      # chaque lundi à 05:00 UTC
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  issues: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mettre à jour les données
        run: python scripts/update.py
      - name: Mettre à jour les cartes Hoyo Cards
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/cards.py --art
      - name: Prévenir en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "La mise à jour automatique a échoué" --body "Le workflow du lundi a échoué. Ouvrez l'onglet Actions pour voir l'erreur, puis relancez-le avec Run workflow." || true
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "astrolabe-bot"
          git config user.email "astrolabe-bot@users.noreply.github.com"
          git add -A data img
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des données" && git push)
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html style.css app.js config.js manifest.webmanifest sw.js favicon.svg favicon.ico fonts data img _site/
      - uses: actions/configure-pages@v5
        id: pages
      - name: Adresse du site pour les aperçus de partage
        run: |
          U="${{ steps.pages.outputs.base_url }}/"
          sed -i "s#__SITE_URL__#${U}#g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
