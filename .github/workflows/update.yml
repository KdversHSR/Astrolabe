name: Mise à jour hebdomadaire

on:
  schedule:
    - cron: "0 5 * * 1"      # chaque lundi à 05:00 UTC
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mettre à jour les données
        run: python scripts/update.py
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "astrolabe-bot"
          git config user.email "astrolabe-bot@users.noreply.github.com"
          git add -A data img
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des données" && git push)
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html style.css app.js config.js data img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
