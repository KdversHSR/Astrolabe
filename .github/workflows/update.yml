name: Mise à jour hebdomadaire

on:
  schedule:
    - cron: "0 5 * * 1"      # chaque lundi à 05:00 UTC
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  issues: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mettre à jour les données
        run: python scripts/update.py
      - name: Tier list Bleach Mirrors High
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/bmh_update.py
      - name: Bannières et événements (paquet gacha-calendar-core)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p /tmp/gcc && cd /tmp/gcc && npm init -y >/dev/null && npm i gacha-calendar-core >/dev/null
          cd "$GITHUB_WORKSPACE" && GCC_PATH=/tmp/gcc/node_modules/gacha-calendar-core/core.mjs node scripts/gg_banners.mjs
      - name: Équipement (armes, artéfacts, moteurs W, disques)
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/gg_equip.py
      - name: Tier lists des pages jeux (Genshin, ZZZ, WuWa, R1999, NTE)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/gg_update.py
      - name: Résumés des versions (Genshin auto + fichier manuel)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/gg_versions.py
      - name: Rosters et images Blue Archive / Arknights
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/gh_images.py
      - name: Mettre à jour les cartes Foilvault
        continue-on-error: true
        timeout-minutes: 50
        run: python scripts/cards.py --art
      - name: Images des arcs de la page Bleach
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/bleach_art.py
      - name: Pages indexables par Google (fiches, plan du site)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/seo.py
      - name: Prévenir en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "La mise à jour automatique a échoué" --body "Le workflow du lundi a échoué. Ouvrez l'onglet Actions pour voir l'erreur, puis relancez-le avec Run workflow." || true
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "astrolabe-bot"
          git config user.email "astrolabe-bot@users.noreply.github.com"
          git add -A data img fiche sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des données" && git push)
      - name: Préparer le site
        run: |
          mkdir _site
          for f in google*.html index.html style.css app.js config.js stats-config.js analytics.js og.png manifest.webmanifest sw.js favicon.svg favicon.ico fonts data img fiche sitemap.xml robots.txt; do [ -e "$f" ] && cp -r "$f" _site/; done; true
      - uses: actions/configure-pages@v5
        id: pages
      - name: Adresse du site pour les aperçus de partage
        run: |
          U="${{ steps.pages.outputs.base_url }}/"
          sed -i "s#__SITE_URL__#${U}#g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
